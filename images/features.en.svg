<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" role="img">
  <title>TouchSocket Feature Map</title>
  <desc>TouchSocket .NET network communication framework feature overview</desc>

  <rect x="0" y="0" width="1200" height="820" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>

  <g>
    <circle cx="600" cy="400" r="86" fill="#1F2937"/>
    <text x="600" y="395" text-anchor="middle" fill="white" font-size="24" font-weight="500" font-family="Segoe UI, Helvetica, Arial, sans-serif">TouchSocket</text>
    <text x="600" y="425" text-anchor="middle" fill="#94A3B8" font-size="13" font-family="Segoe UI, Helvetica, Arial, sans-serif">.NET network framework</text>
  </g>

  <g>
    <rect x="80" y="170" width="280" height="230" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="80" y="170" width="280" height="42" rx="12" fill="#3B82F6"/>
    <text x="220" y="197" text-anchor="middle" fill="white" font-size="15" font-weight="500" font-family="Segoe UI, Helvetica, Arial, sans-serif">TCP Core</text>
    <text x="100" y="245" fill="#1E3A8A" font-size="14" font-family="Segoe UI, Helvetica, Arial, sans-serif">TCP server / client</text>
    <text x="100" y="275" fill="#1E3A8A" font-size="14" font-family="Segoe UI, Helvetica, Arial, sans-serif">IPv6 / multi-endpoint listen</text>
    <text x="100" y="305" fill="#1E3A8A" font-size="14" font-family="Segoe UI, Helvetica, Arial, sans-serif">Auto-reconnect / heartbeat</text>
    <text x="100" y="335" fill="#1E3A8A" font-size="14" font-family="Segoe UI, Helvetica, Arial, sans-serif">Sticky / fragmented packet handling</text>
    <text x="100" y="365" fill="#1E3A8A" font-size="14" font-family="Segoe UI, Helvetica, Arial, sans-serif">Custom data adapters</text>
  </g>

  <g>
    <rect x="80" y="440" width="280" height="190" rx="12" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1.5"/>
    <rect x="80" y="440" width="280" height="42" rx="12" fill="#06B6D4"/>
    <text x="220" y="467" text-anchor="middle" fill="white" font-size="15" font-weight="500" font-family="Segoe UI, Helvetica, Arial, sans-serif">UDP / KCP</text>
    <text x="100" y="515" fill="#164E63" font-size="14" font-family="Segoe UI, Helvetica, Arial, sans-serif">UDP session</text>
    <text x="100" y="545" fill="#164E63" font-size="14" font-family="Segoe UI, Helvetica, Arial, sans-serif">Broadcast / multicast</text>
    <text x="100" y="575" fill="#164E63" font-size="14" font-family="Segoe UI, Helvetica, Arial, sans-serif">&gt;64K datagrams</text>
    <text x="100" y="605" fill="#164E63" font-size="14" font-family="Segoe UI, Helvetica, Arial, sans-serif">KCP reliable UDP</text>
  </g>

  <g>
    <rect x="840" y="70" width="280" height="190" rx="12" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
    <rect x="840" y="70" width="280" height="42" rx="12" fill="#F97316"/>
    <text x="980" y="97" text-anchor="middle" fill="white" font-size="15" font-weight="500" font-family="Segoe UI, Helvetica, Arial, sans-serif">HTTP / WebSocket</text>
    <text x="860" y="145" fill="#7C2D12" font-size="14" font-family="Segoe UI, Helvetica, Arial, sans-serif">HTTP parser / static files</text>
    <text x="860" y="175" fill="#7C2D12" font-size="14" font-family="Segoe UI, Helvetica, Arial, sans-serif">WebSocket server / client</text>
    <text x="860" y="205" fill="#7C2D12" font-size="14" font-family="Segoe UI, Helvetica, Arial, sans-serif">WebApi service</text>
    <text x="860" y="235" fill="#7C2D12" font-size="14" font-family="Segoe UI, Helvetica, Arial, sans-serif">Large file upload / resume</text>
  </g>

  <g>
    <rect x="840" y="300" width="280" height="210" rx="12" fill="#FAF5FF" stroke="#9333EA" stroke-width="1.5"/>
    <rect x="840" y="300" width="280" height="42" rx="12" fill="#9333EA"/>
    <text x="980" y="327" text-anchor="middle" fill="white" font-size="15" font-weight="500" font-family="Segoe UI, Helvetica, Arial, sans-serif">RPC</text>
    <text x="860" y="375" fill="#581C87" font-size="14" font-family="Segoe UI, Helvetica, Arial, sans-serif">WebApi / JsonRpc / XmlRpc</text>
    <text x="860" y="405" fill="#581C87" font-size="14" font-family="Segoe UI, Helvetica, Arial, sans-serif">TouchRpc (DMTP)</text>
    <text x="860" y="435" fill="#581C87" font-size="14" font-family="Segoe UI, Helvetica, Arial, sans-serif">Server calls client</text>
    <text x="860" y="465" fill="#581C87" font-size="14" font-family="Segoe UI, Helvetica, Arial, sans-serif">Call context / rate limiting</text>
  </g>

  <g>
    <rect x="840" y="550" width="280" height="230" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
    <rect x="840" y="550" width="280" height="42" rx="12" fill="#16A34A"/>
    <text x="980" y="577" text-anchor="middle" fill="white" font-size="15" font-weight="500" font-family="Segoe UI, Helvetica, Arial, sans-serif">Industrial Protocols</text>
    <text x="860" y="625" fill="#14532D" font-size="14" font-family="Segoe UI, Helvetica, Arial, sans-serif">Modbus RTU/TCP/UDP</text>
    <text x="860" y="655" fill="#14532D" font-size="14" font-family="Segoe UI, Helvetica, Arial, sans-serif">MQTT server / client</text>
    <text x="860" y="685" fill="#14532D" font-size="14" font-family="Segoe UI, Helvetica, Arial, sans-serif">Socket.IO / CoAP / Redis</text>
    <text x="860" y="715" fill="#14532D" font-size="14" font-family="Segoe UI, Helvetica, Arial, sans-serif">HSMS/SECS-II (Semi)</text>
    <text x="860" y="745" fill="#14532D" font-size="14" font-family="Segoe UI, Helvetica, Arial, sans-serif">MCP (Model Context Protocol)</text>
  </g>

  <g>
    <rect x="320" y="680" width="560" height="110" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5"/>
    <rect x="320" y="680" width="560" height="38" rx="12" fill="#0D9488"/>
    <text x="600" y="704" text-anchor="middle" fill="white" font-size="15" font-weight="500" font-family="Segoe UI, Helvetica, Arial, sans-serif">Plugins &amp; Tools</text>
    <text x="340" y="755" fill="#134E4A" font-size="14" font-family="Segoe UI, Helvetica, Arial, sans-serif">Adapter pipeline</text>
    <text x="470" y="755" fill="#134E4A" font-size="14" font-family="Segoe UI, Helvetica, Arial, sans-serif">ByteBlock memory pool</text>
    <text x="640" y="755" fill="#134E4A" font-size="14" font-family="Segoe UI, Helvetica, Arial, sans-serif">Plugin extensions</text>
    <text x="770" y="755" fill="#134E4A" font-size="14" font-family="Segoe UI, Helvetica, Arial, sans-serif">DI / Hosting</text>
    <text x="880" y="755" fill="#134E4A" font-size="14" font-family="Segoe UI, Helvetica, Arial, sans-serif">Source generators</text>
  </g>

  <line x1="360" y1="285" x2="514" y2="360" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="360" y1="535" x2="514" y2="440" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="840" y1="165" x2="686" y2="340" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="840" y1="405" x2="686" y2="400" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="840" y1="665" x2="686" y2="460" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="600" y1="680" x2="600" y2="486" stroke="#CBD5E1" stroke-width="2"/>
</svg>
